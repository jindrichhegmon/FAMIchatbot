# Netlify: statický frontend (public/) + API jako Netlify Function (netlify/functions/api.mjs → /api/*)
[build]
  publish = "public"
  command = "echo 'no build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # prompt a konfigurace se čtou ze souborů za běhu
  included_files = ["prompt/**", "config/**"]

<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Fami – asistentka FamiCura</title>
  <meta name="description" content="Fami vám pomůže najít vhodnou zdravotní nebo sociální péči a poskytovatele ve vašem okrese.">
  <style>
    :root { --c: #2b5bd7; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #eef2f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .page { max-width: 760px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
    header a { color: var(--c); text-decoration: none; font-weight: 600; font-size: 14px; }
    header h1 { margin: 0; font-size: 18px; color: #1c2333; }
    #chat { flex: 1; min-height: 0; background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(20, 40, 90, .12); overflow: hidden; }
    @media (max-width: 600px) { .page { padding: 0; } #chat { border-radius: 0; } header { padding: 10px 14px; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Fami – asistentka FamiCura</h1>
      <a href="https://www.famicura.cz" rel="noopener">← famicura.cz</a>
    </header>
    <div id="chat"></div>
  </div>
  <script src="/widget.js" data-mode="inline" data-container="#chat" defer></script>
</body>
</html>
